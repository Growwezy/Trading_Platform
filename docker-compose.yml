services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # host 6379 is already taken by another project's container
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis

volumes:
  redis-data:
